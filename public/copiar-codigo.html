<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Copiar código | NIWI MU</title><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f5f5f5;color:#222;font-family:Arial,sans-serif}main{text-align:center;padding:32px;max-width:480px}h1{font-weight:300;letter-spacing:5px}#code{font-size:32px;letter-spacing:5px;padding:20px;background:#eaeaea;border-radius:12px;user-select:all}button{padding:12px 28px;border:2px solid #999;border-radius:24px;cursor:pointer;background:#eee}p{line-height:1.5}button:focus-visible{outline:3px solid #555;outline-offset:4px}</style></head><body><main><h1>NIWI MU</h1><h2>Tu código de validación</h2><p id="code"></p><button id="copy">Copiar código</button><p id="status" role="status">Vuelve a la pestaña del registro y pega el código.</p></main><script>
const code=decodeURIComponent(location.hash.slice(1));history.replaceState(null,'',location.pathname);const valid=/^[A-Z0-9]{8}$/.test(code);document.getElementById('code').textContent=valid?code:'Código inválido';document.getElementById('copy').disabled=!valid;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(code);document.getElementById('status').textContent='Código copiado. Pégalo en la pestaña del registro.'}catch{document.getElementById('status').textContent='Selecciona el código y cópialo manualmente.'}};
</script></body></html>
